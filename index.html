<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tesla Order Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('https://images2.alphacoders.com/105/1052786.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        @supports not (backdrop-filter: blur(10px)) {
            .glass-effect {
                background: rgba(255, 255, 255, 0.5);
            }
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .status-label {
            font-weight: bold;
            color: #3b82f6;
            flex: 1;
        }
        .status-value {
            flex: 2;
            text-align: left;
            color: #e5e7eb;
        }
        .section-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #3b82f6;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .progress-container {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 10;
        }
        .progress-bar {
            height: 100%;
            background: #3b82f6;
            width: 0;
            transition: width 30s linear;
            position: relative;
        }
        .progress-icon-start,
        .progress-icon-end {
            position: absolute;
            top: 10px;
            width: 30px;
            height: 10px;
            transition: all 30s linear;
        }
        .progress-icon-start {
            left: -20px;
        }
        .progress-icon-end {
            right: -20px;
            top: 0px;
            height: 10px;
        }
        .skeleton {
            @apply animate-pulse bg-gray-600 bg-opacity-50 h-6 rounded;
        }
        .floating-link {
            position: fixed;
            right: 20px;
            z-index: 20;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: bold;
            color: #3b82f6;
            text-decoration: none;
            border-radius: 0.5rem;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .floating-link:hover {
            background: rgba(59, 130, 246, 0.2);
            color: #e5e7eb;
        }
        .github-link {
            top: 20px;
        }
        .blog-link {
            top: 60px;
        }
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            .section-title {
                font-size: 1rem;
            }
            .status-item {
                flex-direction: column;
                gap: 0.25rem;
            }
            .status-label, .status-value {
                text-align: left;
                flex: none;
            }
            h1 {
                font-size: 1.5rem;
            }
            .floating-link {
                right: 10px;
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
            }
            .github-link {
                top: 10px;
            }
            .blog-link {
                top: 50px;
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-white font-sans">
    <a href="https://github.com/DigitalSaviour/tesla-order-status" class="floating-link github-link glass-effect" target="_blank" rel="noopener noreferrer" aria-label="View project on GitHub">GitHub Repo</a>
    <a href="https://www.digitalsaviour.co.uk" class="floating-link blog-link glass-effect" target="_blank" rel="noopener noreferrer" aria-label="Visit Digital Saviour blog">My Blog</a>
    <div class="progress-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Status refresh progress upp">
        <div class="progress-bar" id="progressBar">
            <img src="tesla3.png" alt="" class="progress-icon-start" id="progressIconStart" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIGZpbGw9IiMzYjgyZjYiIHJ4PSIzIi8+PHRleHQgeD0iMTAiIHk9IjI1IiBmaWxsPSJ3aGl0ZSIgZm9udC1zaXplPSIxOCI+VC90ZXh0Pjwvc3ZnPg=='">
            <img src="model3.png" alt="Progress end icon" class="progress-icon-end" id="progressIconEnd" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCA0MCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAiIGhlaWdodD0iMjQiIGZpbGw9IiMzYjgyZjYiIHJ4PSIzIi8+PHRleHQgeD0iMTAiIHk9IjE2IiBmaWxsPSJ3aGl0ZSIgZm9udC1zaXplPSIxMiI+TS90ZXh0Pjwvc3ZnPg=='">
        </div>
    </div>
    <div class="container mx-auto p-6 max-w-3xl glass-effect rounded-xl shadow-lg flex-1" data-file="current_output.txt" data-vin-file="vin.txt">
        <div class="text-center">
            <img src='teslalogo.png' class="inline-block w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24">
        </div>
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-center mb-6 text-tesla-blue"><font color='#000000'>Lee's Tesla Order Status</font></h1>
        <div id="statusOutput" class="bg-gray-800 bg-opacity-80 p-4 sm:p-6 rounded-lg text-base sm:text-lg" aria-live="polite">
            <div class="skeleton h-6 w-full mb-2"></div>
            <div class="skeleton h-6 w-3/4"></div>
        </div>
        <div id="vinOutput" class="bg-gray-800 bg-opacity-80 p-4 sm:p-6 rounded-lg text-base sm:text-lg mt-4" aria-live="polite">
            <div class="skeleton h-6 w-full mb-2"></div>
            <div class="skeleton h-6 w-3/4"></div>
        </div>
        <p class="text-center mt-6 text-xs sm:text-sm text-gray-400">Last updated: <span id="lastUpdated">N/A</span></p>
        <div id="errorDetails" class="mt-4 text-center text-xs sm:text-sm text-red-400 hidden" role="alert"></div>
    </div>

    <script>
        function cleanAnsiCodes(text) {
            return text.replace(/\x1B\[[0-?]*[ -/]*[@-~]/g, '').trim();
        }

        function resetProgressBar() {
            const progressBar = document.getElementById('progressBar');
            const progressIconStart = document.getElementById('progressIconStart');
            const progressIconEnd = document.getElementById('progressIconEnd');
            progressBar.style.transition = 'none';
            progressIconStart.style.transition = 'none';
            progressIconEnd.style.transition = 'none';
            progressBar.style.width = '0%';
            progressIconStart.style.left = '-20px';
            progressIconEnd.style.right = '-20px';
            progressBar.setAttribute('aria-valuenow', '0');
            void progressBar.offsetWidth;
            progressBar.style.transition = 'width 30s linear';
            progressIconStart.style.transition = 'left 30s linear';
            progressIconEnd.style.transition = 'right 30s linear';
            requestAnimationFrame(() => {
                progressBar.style.width = '100%';
                progressIconStart.style.left = 'calc(100% - 20px)';
                progressIconEnd.style.right = '0';
                progressBar.setAttribute('aria-valuenow', '100');
            });
        }

        async function fetchStatusAndVin() {
            const outputDiv = document.getElementById('statusOutput');
            const vinOutputDiv = document.getElementById('vinOutput');
            const errorDiv = document.getElementById('errorDetails');
            const lastUpdatedSpan = document.getElementById('lastUpdated');
            const container = document.querySelector('.container');
            const statusFilePath = container.dataset.file || 'current_output.txt';
            const vinFilePath = container.dataset.vinFile || 'vin.txt';

            // Show skeleton loaders
            outputDiv.innerHTML = `
                <div class="skeleton h-6 w-full mb-2"></div>
                <div class="skeleton h-6 w-3/4"></div>
            `;
            vinOutputDiv.innerHTML = `
                <div class="skeleton h-6 w-full mb-2"></div>
                <div class="skeleton h-6 w-3/4"></div>
            `;

            try {
                // Fetch status file
                const statusResponse = await fetch(statusFilePath, {
                    method: 'GET',
                    cache: 'no-cache'
                });

                if (!statusResponse.ok) {
                    if (statusResponse.status === 404) {
                        throw new Error('Status file not found');
                    } else {
                        throw new Error(`HTTP error ${statusResponse.status}: ${statusResponse.statusText}`);
                    }
                }

                const statusText = await statusResponse.text();
                const cleanStatusText = cleanAnsiCodes(statusText);
                const statusLines = cleanStatusText.split('\n').filter(line => line.trim() !== '');
                const relevantStatusLines = statusLines.slice(4);

                outputDiv.innerHTML = '';
                if (relevantStatusLines.length === 0) {
                    outputDiv.innerHTML = '<p class="text-gray-300">No status information available.</p>';
                } else {
                    let currentSection = null;
                    relevantStatusLines.forEach(line => {
                        if (line.match(/^[A-Za-z\s]+:$/)) {
                            const sectionDiv = document.createElement('div');
                            sectionDiv.className = 'section-title';
                            sectionDiv.textContent = line.trim();
                            sectionDiv.setAttribute('role', 'heading');
                            sectionDiv.setAttribute('aria-level', '2');
                            outputDiv.appendChild(sectionDiv);
                            currentSection = sectionDiv;
                        } else if (line.match(/^-\s/)) {
                            const parts = line.replace(/^-\s/, '').split(':', 2).map(s => s.trim());
                            if (parts.length === 2 && parts[0] && parts[1]) {
                                const itemDiv = document.createElement('div');
                                itemDiv.className = 'status-item';
                                const displayValue = parts[0] === 'Delivery Appointment' && parts[1] ? 'Delivery booked' : parts[1];
                                itemDiv.innerHTML = `
                                    <span class="status-label">${parts[0]}:</span>
                                    <span class="status-value">${displayValue}</span>
                                `;
                                outputDiv.appendChild(itemDiv);
                            }
                        }
                    });
                }

                // Fetch VIN file
                const vinResponse = await fetch(vinFilePath, {
                    method: 'GET',
                    cache: 'no-cache'
                });

                if (!vinResponse.ok) {
                    if (vinResponse.status === 404) {
                        throw new Error('VIN file not found');
                    } else {
                        throw new Error(`HTTP error ${vinResponse.status}: ${vinResponse.statusText}`);
                    }
                }

                const vinText = await vinResponse.text();
                const cleanVinText = cleanAnsiCodes(vinText);
                const vinLines = cleanVinText.split('\n').filter(line => line.trim() !== '');

                vinOutputDiv.innerHTML = '';
                if (vinLines.length === 0) {
                    vinOutputDiv.innerHTML = '<p class="text-gray-300">No vehicle information available.</p>';
                } else {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'section-title';
                    sectionDiv.textContent = 'Vehicle Information';
                    sectionDiv.setAttribute('role', 'heading');
                    sectionDiv.setAttribute('aria-level', '2');
                    vinOutputDiv.appendChild(sectionDiv);

                    vinLines.forEach(line => {
                        const parts = line.split(':', 2).map(s => s.trim());
                        if (parts.length === 2 && parts[0] && parts[1]) {
                            const itemDiv = document.createElement('div');
                            itemDiv.className = 'status-item';
                            itemDiv.innerHTML = `
                                <span class="status-label">${parts[0]}:</span>
                                <span class="status-value">${parts[1]}</span>
                            `;
                            vinOutputDiv.appendChild(itemDiv);
                        }
                    });
                }

                lastUpdatedSpan.textContent = new Date().toLocaleString();
                errorDiv.classList.add('hidden');
                resetProgressBar();
            } catch (error) {
                console.error('Error fetching data:', error);
                outputDiv.innerHTML = '<p class="text-red-400">Error loading status: Unable to fetch data</p>';
                vinOutputDiv.innerHTML = '<p class="text-red-400">Error loading vehicle information: Unable to fetch data</p>';
                errorDiv.innerHTML = `Detailed error: ${error.message}. Please ensure the status and VIN files exist and are accessible.`;
                errorDiv.classList.remove('hidden');
            }
        }

        if (!CSS.supports('backdrop-filter', 'blur(10px)')) {
            console.warn('Backdrop-filter not supported; using fallback background.');
        }

        fetchStatusAndVin();
        setInterval(fetchStatusAndVin, 30000);
    </script>
</body>
</html>
